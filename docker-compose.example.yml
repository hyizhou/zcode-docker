name: zcode-webvnc

services:
  zcode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.cloud.tencent.com}
    image: zcode-webvnc:latest
    container_name: zcode-webvnc
    restart: unless-stopped
    shm_size: 512m
    environment:
      VNC_PASSWORD: zcode123
      VNC_ENABLED: ${VNC_ENABLED:-1}
      EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    ports:
      - "6080:6080"
    volumes:
      - zcode-data:/data
      - ./init:/data/init
      - ./workspace:/workspace

volumes:
  zcode-data:
